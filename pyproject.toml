[project]
name = "aiops"
version = "0.1.0"
description = "HAIC LSTM model serving and MLOps practice"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.3",
    "numpy==2.4.4",
    "tensorflow==2.21.0",
    "mlflow==3.16.0",
    "requests==2.33.1",
    "python-multipart==0.0.20",
    "uvicorn[standard]==0.46.0",
]

[dependency-groups]
dev = ["httpx2>=2.0,<3.0", "httpx>=0.28,<1.0", "pip>=26,<27", "ruff>=0.9,<1.0"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"project/scripts/*.py" = ["E402"]
"project/serving_app/train_and_register.py" = ["E402"]
