# 빈 runtime은 자동 학습·등록하고 기존 Production은 재사용합니다.
services:
  serving-app:
    build:
      context: ..
      dockerfile: serving_app/Dockerfile
    ports: ["8099:8099"]
    environment:
      MODEL_SOURCE: ${MODEL_SOURCE:-mlflow}
      LOADING_MODE: eager
      AUTO_PREPARE: "1"
    volumes:
      - ./models/solar-daily:/app/serving_app/models/solar-daily:ro
      - ../data/uploads:/app/data/uploads
      - solar-runtime:/app/runtime
      - solar-logs:/app/logs
volumes:
  solar-runtime:
  solar-logs:
