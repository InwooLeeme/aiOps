# 먼저 동일 runtime 볼륨에 태양광 Production 모델을 등록하세요(README 참고).
services:
  serving-app:
    build:
      context: ..
      dockerfile: serving_app/Dockerfile
    ports: ["8099:8099"]
    environment:
      MODEL_SOURCE: ${MODEL_SOURCE:-mlflow}
      LOADING_MODE: eager
    volumes:
      - ./models/solar:/app/serving_app/models/solar:ro
      - ../data/uploads:/app/data/uploads
      - solar-runtime:/app/runtime
      - solar-logs:/app/logs
volumes:
  solar-runtime:
  solar-logs:
